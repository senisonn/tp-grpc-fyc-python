syntax = "proto3";

package clientservice;

message Client {
  int32 id = 1;
  string nom = 2;
  string email = 3;
}

message ClientRequest {
  int32 id = 1;
}

message ClientResponse {
  Client client = 1;
  string error = 2; 
}

service ClientService {
  rpc GetClient(ClientRequest) returns (ClientResponse);
}