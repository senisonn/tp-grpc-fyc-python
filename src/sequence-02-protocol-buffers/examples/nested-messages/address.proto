syntax = "proto3";

/**
 * Example demonstrating nested messages in Protocol Buffers
 * Shows how to compose complex structures from simpler ones
 */

// Basic address message
message Address {
  string street = 1;
  string city = 2;
  string state = 3;
  string zip_code = 4;
  string country = 5;
}

// Coordinates for location
message Coordinates {
  double latitude = 1;
  double longitude = 2;
}

// Enhanced address with coordinates
message LocationAddress {
  string street = 1;
  string city = 2;
  string state = 3;
  string zip_code = 4;
  string country = 5;
  Coordinates coordinates = 6;  // Nested message
}

// Person with nested address
message Person {
  int32 id = 1;
  string name = 2;
  string email = 3;
  Address home_address = 4;      // Nested message
  Address work_address = 5;      // Nested message
}

// Company with multiple nested structures
message Company {
  string name = 1;
  Address headquarters = 2;
  repeated Address offices = 3;

  // Nested message for employee
  message Employee {
    int32 id = 1;
    string name = 2;
    string email = 3;
    string department = 4;
    Address address = 5;
  }

  repeated Employee employees = 4;
}

// Order with nested items and shipping
message Order {
  int32 id = 1;
  string customer_name = 2;

  message OrderItem {
    int32 product_id = 1;
    string product_name = 2;
    int32 quantity = 3;
    float unit_price = 4;
    float total_price = 5;
  }

  repeated OrderItem items = 3;

  message ShippingInfo {
    Address shipping_address = 1;
    string carrier = 2;
    string tracking_number = 3;
    int64 estimated_delivery = 4;
  }

  ShippingInfo shipping = 4;

  float total_amount = 5;
  int64 order_date = 6;
}

// Profile with deeply nested structures
message UserProfile {
  int32 user_id = 1;
  string username = 2;

  message PersonalInfo {
    string first_name = 1;
    string last_name = 2;
    string email = 3;
    string phone = 4;
    Address address = 5;
  }

  PersonalInfo personal_info = 3;

  message Preferences {
    string theme = 1;
    string language = 2;
    bool notifications_enabled = 3;

    message NotificationSettings {
      bool email = 1;
      bool sms = 2;
      bool push = 3;
    }

    NotificationSettings notifications = 4;
  }

  Preferences preferences = 4;

  message Stats {
    int32 posts_count = 1;
    int32 followers_count = 2;
    int32 following_count = 3;
    int64 joined_date = 4;
  }

  Stats stats = 5;
}

// Enum with nested message
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_PROCESSING = 2;
  ORDER_STATUS_SHIPPED = 3;
  ORDER_STATUS_DELIVERED = 4;
}

message DetailedOrder {
  int32 id = 1;
  OrderStatus status = 2;

  message StatusHistory {
    OrderStatus status = 1;
    int64 timestamp = 2;
    string note = 3;
  }

  repeated StatusHistory history = 3;
}

// Oneof with nested messages
message ContactInfo {
  int32 id = 1;
  string name = 2;

  message EmailContact {
    string email = 1;
    bool verified = 2;
  }

  message PhoneContact {
    string number = 1;
    string country_code = 2;
    bool verified = 3;
  }

  message SocialContact {
    string platform = 1;
    string handle = 2;
  }

  oneof contact_method {
    EmailContact email_info = 3;
    PhoneContact phone_info = 4;
    SocialContact social_info = 5;
  }
}
