####################
# Envoy Configuration avec CORS Complet
# Usage: Configuration pour développement avec support CORS total
####################

static_resources:
  listeners:
  - name: grpc_web_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          
          stat_prefix: grpc_web_with_cors
          codec_type: AUTO
          
          # Filtres HTTP
          http_filters:
          # 1. gRPC-Web filter
          - name: envoy.filters.http.grpc_web
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
          
          # 2. CORS filter (ESSENTIEL)
          - name: envoy.filters.http.cors
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
          
          # 3. Router (toujours en dernier)
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          
          # Configuration des routes
          route_config:
            name: local_routes
            virtual_hosts:
            - name: grpc_services
              domains: ["*"]
              
              # CONFIGURATION CORS COMPLÈTE
              cors:
                # Origines autorisées
                allow_origin_string_match:
                # DÉVELOPPEMENT - Autoriser localhost sur tous les ports
                - safe_regex:
                    regex: "http://localhost:[0-9]+"
                - exact: "http://localhost:3000"
                - exact: "http://localhost:3001"
                - exact: "http://127.0.0.1:3000"
                # Production - À commenter en dev, décommenter en prod
                # - exact: "https://my-app.com"
                # - exact: "https://www.my-app.com"
                
                # Méthodes HTTP autorisées
                allow_methods: "GET, POST, PUT, DELETE, OPTIONS, PATCH"
                
                # En-têtes que le client peut envoyer
                allow_headers: |
                  keep-alive,
                  user-agent,
                  cache-control,
                  content-type,
                  content-transfer-encoding,
                  x-accept-content-transfer-encoding,
                  x-accept-response-streaming,
                  x-user-agent,
                  x-grpc-web,
                  grpc-timeout,
                  grpc-encoding,
                  authorization,
                  x-api-key,
                  x-request-id
                
                # Durée de cache de la requête preflight (en secondes)
                max_age: "86400"  # 24 heures
                
                # En-têtes que le client peut lire dans la réponse
                expose_headers: |
                  grpc-status,
                  grpc-message,
                  grpc-status-details-bin,
                  grpc-encoding,
                  grpc-accept-encoding,
                  x-envoy-upstream-service-time,
                  x-request-id
                
                # Autoriser les credentials (cookies, authorization headers)
                allow_credentials: true
              
              # Routes
              routes:
              # Route pour tous les services gRPC
              - match:
                  prefix: "/"
                  grpc: {}
                route:
                  cluster: grpc_backend
                  timeout: 60s
                  # Retry policy pour plus de résilience
                  retry_policy:
                    retry_on: "5xx"
                    num_retries: 3
                    per_try_timeout: 20s
              
              # Route pour le health check (optionnel)
              - match:
                  prefix: "/health"
                direct_response:
                  status: 200
                  body:
                    inline_string: "OK"
  
  # Clusters backend
  clusters:
  - name: grpc_backend
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    
    # HTTP/2 explicite pour gRPC
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    
    # Endpoints backend
    load_assignment:
      cluster_name: grpc_backend
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                # Dans Docker Compose: nom du service
                address: grpc-server
                port_value: 50051
                # Hors Docker: localhost
                # address: 127.0.0.1
                # port_value: 50051
    
    # Health checks (optionnel mais recommandé)
    health_checks:
    - timeout: 1s
      interval: 5s
      unhealthy_threshold: 2
      healthy_threshold: 2
      grpc_health_check:
        service_name: ""

# Interface d'administration
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

