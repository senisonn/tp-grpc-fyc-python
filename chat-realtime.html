<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Temps Réel - gRPC</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            height: 90vh;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* ✅ FIX: Retirer le !important qui causait le conflit */
        #chat-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        /* ✅ FIX: .hidden doit être plus spécifique */
        #chat-screen.hidden {
            display: none !important;
        }
        
        .header {
            flex-shrink: 0;
            background: #667eea;
            color: white;
            padding: 20px;
            border-radius: 15px 15px 0 0;
        }
        .header h1 { margin-bottom: 5px; font-size: 24px; }
        .status { font-size: 14px; opacity: 0.9; }
        
        .messages {
            flex: 1;
            overflow-y: scroll;
            overflow-x: hidden;
            padding: 20px;
            background: #f8f9fa;
            min-height: 0;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 12px 15px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.own { background: #d4edda; border-left-color: #28a745; }
        .message.system { background: #fff3cd; border-left-color: #ffc107; text-align: center; }
        .message-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px; }
        .message-user { font-weight: bold; color: #667eea; }
        .message-time { color: #999; }
        .message-content { color: #333; word-wrap: break-word; }
        
        .input-area { 
            flex-shrink: 0;
            padding: 20px; 
            background: white; 
            border-top: 1px solid #e0e0e0; 
        }
        
        .input-group { display: flex; gap: 10px; }
        input[type="text"], input[type="password"] {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        input[type="text"] { flex: 1; }
        .login-screen input, .room-screen input { width: 100%; max-width: 400px; margin: 10px 0; }
        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        button:hover { background: #5568d3; }
        button.danger { background: #dc3545; }
        button.danger:hover { background: #c82333; }
        .login-screen, .room-screen { padding: 40px; text-align: center; }
        .room-list { max-width: 600px; margin: 20px auto; text-align: left; }
        .room-item {
            padding: 15px;
            margin: 10px 0;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .room-item:hover { background: #e9ecef; transform: translateX(5px); }
        .hidden { display: none !important; }
        .error { color: #dc3545; margin-top: 15px; }
    </style>
</head>
<body>
    <!-- Le reste du HTML reste identique -->
    <div class="container">
        <!-- Login -->
        <div id="login-screen" class="login-screen">
            <h1>🚀 Chat Temps Réel</h1>
            <p style="margin: 20px 0; color: #666;">gRPC Streaming Bidirectionnel</p>
            <input type="text" id="username" placeholder="Username" value="admin">
            <input type="password" id="password" placeholder="Password" value="admin123">
            <br><br>
            <button onclick="login()">Se Connecter</button>
            <div id="login-error" class="error"></div>
        </div>

        <!-- Rooms -->
        <div id="room-screen" class="login-screen hidden">
            <h2>📋 Choisir une Room</h2>
            <div class="room-list" id="room-list"></div>
            <button onclick="createRoom()">➕ Nouvelle Room</button>
            <button onclick="logout()" class="danger" style="margin-left: 10px;">🚪 Déconnexion</button>
        </div>

        <!-- Chat -->
        <div id="chat-screen" class="hidden">
            <div class="header">
                <h1 id="room-name">💬 Chat</h1>
                <div class="status" id="status">⚪ Déconnecté</div>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <div class="input-group">
                    <input type="text" id="message-input" placeholder="Votre message..." 
                           onkeypress="if(event.key==='Enter') sendMessage()">
                    <button onclick="sendMessage()">📤 Envoyer</button>
                    <button onclick="leaveChat()" class="danger">🚪 Quitter</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Le JavaScript reste identique
        let socket;
        let authToken;
        let currentUser;
        let currentRoom;

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:5001/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.token) {
                    authToken = data.token;
                    currentUser = data.user;
                    connectWebSocket();
                    showRoomScreen();
                } else {
                    document.getElementById('login-error').textContent = data.error || 'Erreur';
                }
            } catch (error) {
                document.getElementById('login-error').textContent = error.message;
            }
        }

        function connectWebSocket() {
            if (socket && socket.connected) {
                console.log('⚠️ Socket déjà connecté, pas de reconnexion');
                return;
            }
            
            socket = io('http://localhost:5000', {
                reconnection: false
            });

            socket.on('connect', () => {
                console.log('✅ WebSocket connecté, SID:', socket.id);
                updateStatus('🟢 Connecté', '#28a745');
                socket.emit('authenticate', { token: authToken });
            });

            socket.on('disconnect', () => {
                console.log('❌ WebSocket déconnecté');
                updateStatus('🔴 Déconnecté', '#dc3545');
            });

            socket.on('authenticated', (data) => {
                console.log('✅ Authentifié:', data.user);
            });

            socket.off('new_message');
            socket.on('new_message', (message) => {
                console.log('🔔 new_message reçu:', message);
                displayMessage(message);
            });

            socket.off('joined_chat');
            socket.on('joined_chat', (data) => {
                console.log('✅ Rejoint:', data.room_id);
            });

            socket.off('error');
            socket.on('error', (data) => {
                alert('Erreur: ' + data.message);
            });
        }

        async function showRoomScreen() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('room-screen').classList.remove('hidden');
            await loadRooms();
        }

        async function loadRooms() {
            try {
                const response = await fetch('http://localhost:5000/api/rooms', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                const data = await response.json();
                const roomList = document.getElementById('room-list');
                roomList.innerHTML = '';

                if (data.rooms.length === 0) {
                    roomList.innerHTML = '<p style="color: #999; text-align: center;">Aucune room. Créez-en une !</p>';
                    return;
                }

                data.rooms.forEach(room => {
                    const div = document.createElement('div');
                    div.className = 'room-item';
                    div.innerHTML = `
                        <strong style="font-size: 16px;">${room.name}</strong><br>
                        <small style="color: #666;">${room.description || 'Pas de description'}</small><br>
                        <small style="color: #667eea;">👥 ${room.member_count} membre(s)</small>
                    `;
                    div.onclick = () => joinRoom(room);
                    roomList.appendChild(div);
                });
            } catch (error) {
                console.error('Erreur:', error);
            }
        }

        async function createRoom() {
            const name = prompt('Nom de la room:');
            if (!name) return;
            
            const description = prompt('Description:');

            try {
                await fetch('http://localhost:5000/api/rooms', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ name, description })
                });
                await loadRooms();
            } catch (error) {
                alert('Erreur: ' + error.message);
            }
        }

        async function joinRoom(room) {
            currentRoom = room;
            
            await loadHistory(room.id);
            
            socket.emit('join_chat', {
                room_id: room.id,
                user: currentUser
            });
            
            document.getElementById('room-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            document.getElementById('room-name').textContent = '💬 ' + room.name;
            updateStatus('🟢 Chat temps réel actif', '#28a745');
            document.getElementById('message-input').focus();
        }

        async function loadHistory(roomId) {
            try {
                const response = await fetch(`http://localhost:5000/api/rooms/${roomId}/history?limit=50`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                const data = await response.json();
                document.getElementById('messages').innerHTML = '';
                
                data.messages.forEach(msg => displayMessage(msg, true));
                
                setTimeout(() => {
                    const messagesDiv = document.getElementById('messages');
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }, 100);
            } catch (error) {
                console.error('Erreur historique:', error);
            }
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            
            if (!content) return;
            
            console.log('📤 Envoi message:', content);
            socket.emit('send_message', { content });
            input.value = '';
        }
        
        function displayMessage(message, isHistory = false) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            
            const isOwn = message.user_id === currentUser.user_id;
            const isSystem = message.type && message.type !== 'TEXT';
            
            messageDiv.className = 'message' + 
                (isOwn ? ' own' : '') + 
                (isSystem ? ' system' : '');
            
            const time = new Date(message.timestamp * 1000).toLocaleTimeString('fr-FR');
            
            if (isSystem) {
                messageDiv.innerHTML = `
                    <div class="message-time">${time}</div>
                    <div class="message-content">${message.content}</div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="message-header">
                        <span class="message-user">${isOwn ? 'Vous' : message.username}</span>
                        <span class="message-time">${time}</span>
                    </div>
                    <div class="message-content">${message.content}</div>
                `;
            }
            
            messagesDiv.appendChild(messageDiv);
            
            if (!isHistory) {
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }

        function leaveChat() {
            socket.emit('leave_chat');
            
            document.getElementById('chat-screen').classList.add('hidden');
            document.getElementById('room-screen').classList.remove('hidden');
            
            currentRoom = null;
            loadRooms();
        }

        function logout() {
            if (socket) socket.disconnect();
            authToken = null;
            currentUser = null;
            
            document.getElementById('room-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        function updateStatus(text, color) {
            const status = document.getElementById('status');
            status.textContent = text;
            if (color) status.style.color = color;
        }
    </script>
</body>
</html>
