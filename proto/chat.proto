syntax = "proto3";

package chat;

service ChatService {
  // Unary
  rpc CreateRoom(CreateRoomRequest) returns (Room);
  rpc JoinRoom(JoinRoomRequest) returns (JoinRoomResponse);
  
  // Bidirectional streaming
  rpc StreamMessages(stream ChatMessage) returns (stream ChatMessage);
  
  // Server streaming
  rpc GetRoomHistory(RoomHistoryRequest) returns (stream ChatMessage);
}

message ChatMessage {
  string room_id = 1;
  string user_id = 2;
  string username = 3;
  string content = 4;
  int64 timestamp = 5;
}

message Room {
  string id = 1;
  string name = 2;
  repeated string members = 3;
}