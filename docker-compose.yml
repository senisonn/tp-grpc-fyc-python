version: '3.8'

services:
  envoy:
    image: envoyproxy/envoy:v1.28-latest
    ports:
      - "8080:8080"
      - "9901:9901"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
    networks:
      - grpc-network

  gateway:
    build: ./gateway-service
    environment:
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - auth-service
      - chat-service
    networks:
      - grpc-network

  auth-service:
    build: ./auth-service
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY=${AUTH_API_KEY}
    networks:
      - grpc-network

  chat-service:
    build: ./chat-service
    environment:
      - API_KEY=${CHAT_API_KEY}
      - LOGGING_SERVICE_API_KEY=${LOGGING_API_KEY}
    depends_on:
      - logging-service
    networks:
      - grpc-network

  logging-service:
    build: ./logging-service
    environment:
      - API_KEY=${LOGGING_API_KEY}
    volumes:
      - logs-data:/app/logs
    networks:
      - grpc-network
      
networks:
  grpc-network:
    driver: bridge

volumes:
  logs-data: