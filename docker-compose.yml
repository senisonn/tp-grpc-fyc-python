version: '3.8'

services:
  logging-service:
    build: 
      context: ./logging-service
      dockerfile: Dockerfile
    container_name: grpc-logging
    environment:
      - SERVICE_PORT=50053
      - API_KEY=logging-service-api-key-123
      - LOG_DIRECTORY=/app/logs
      - LOG_LEVEL=INFO
    ports:
      - "50053:50053"
    volumes:
      - ./logging-service/logs:/app/logs
    networks:
      - grpc-network
    restart: unless-stopped

  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: grpc-chat
    environment:
      - SERVICE_PORT=50052
      - API_KEY=chat-service-api-key-456
      - LOGGING_SERVICE_HOST=logging-service
      - LOGGING_SERVICE_PORT=50053
      - LOGGING_API_KEY=logging-service-api-key-123
      - MAX_ROOM_MEMBERS=100
      - MAX_MESSAGE_LENGTH=1000
      - MESSAGE_HISTORY_LIMIT=100
      - LOG_LEVEL=INFO
    ports:
      - "50052:50052"
    networks:
      - grpc-network
    depends_on:
      - logging-service
    restart: unless-stopped

networks:
  grpc-network:
    driver: bridge

volumes:
  logs-data: